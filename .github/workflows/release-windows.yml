name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name CourseClicker `
            app.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/CourseClicker.exe `
            -DestinationPath dist/CourseClicker-Windows-x64.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/CourseClicker.exe" `
            "dist/CourseClicker-Windows-x64.zip" `
            --verify-tag `
            --generate-notes `
            --title "Course Clicker ${{ github.ref_name }}"