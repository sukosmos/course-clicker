name: Release Course Clicker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:

  # =========================================================
  # Windows x64
  # =========================================================

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name CourseClicker `
            app.py

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/CourseClicker.exe `
            -DestinationPath dist/CourseClicker-Windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/CourseClicker.exe
            dist/CourseClicker-Windows-x64.zip
          if-no-files-found: error


  # =========================================================
  # macOS Apple Silicon
  # =========================================================

  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show architecture
        run: |
          python --version
          uname -m

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name CourseClicker \
            app.py

      - name: Verify app
        run: |
          test -d dist/CourseClicker.app
          ls -lah dist

      - name: Create macOS ZIP
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/CourseClicker.app \
            dist/CourseClicker-macOS-Apple-Silicon.zip

      - name: Upload macOS Apple Silicon build
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-release
          path: dist/CourseClicker-macOS-Apple-Silicon.zip
          if-no-files-found: error


  # =========================================================
  # macOS Intel
  # =========================================================

  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show architecture
        run: |
          python --version
          uname -m

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name CourseClicker \
            app.py

      - name: Verify app
        run: |
          test -d dist/CourseClicker.app
          ls -lah dist

      - name: Create macOS ZIP
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/CourseClicker.app \
            dist/CourseClicker-macOS-Intel.zip

      - name: Upload macOS Intel build
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-release
          path: dist/CourseClicker-macOS-Intel.zip
          if-no-files-found: error


  # =========================================================
  # GitHub Release
  # =========================================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-macos-arm64
      - build-macos-intel

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release

      - name: Download macOS Apple Silicon build
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-release
          path: release

      - name: Download macOS Intel build
        uses: actions/download-artifact@v8
        with:
          name: macos-intel-release
          path: release

      - name: Show release files
        run: |
          ls -lah release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/CourseClicker.exe" \
            "release/CourseClicker-Windows-x64.zip" \
            "release/CourseClicker-macOS-Apple-Silicon.zip" \
            "release/CourseClicker-macOS-Intel.zip" \
            --repo sukosmos/course-clicker \
            --verify-tag \
            --generate-notes \
            --title "Course Clicker ${{ github.ref_name }}"